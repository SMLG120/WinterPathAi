openapi: 3.1.0
info:
  title: WinterPath AI API
  version: 1.8.0
  summary: Montréal pedestrian winter-routing API (contract v1.3.0; v1.0.0 frozen 2026-11-10; v1.1.0 declared 4xx per CR-PLAT-1; v1.3.0 adds 503 on data-backed endpoints and OFF_NETWORK per CR-ROUTING-2/3; v1.5.0 documents deletion-token semantics (CR-ROUTING-4) and the explanation-code evidence mapping (CR-ROUTING-9); v1.6.0 adds 311 alley categories (CR-ML-2) and the foot-over-access rule (CR-DATA-7), no schema shape change; v1.7.0 adds WRITES_DISABLED (503) on public write endpoints for the read-only demo deployment; v1.8.0 adds live ECCC forecast/alert freshness and provenance, GET /weather/alerts and GET /data-status — additive only).
  description: |
    All geometries are GeoJSON in EPSG:4326 with [longitude, latitude] ordering.
    Every risk/condition datum carries an `evidence` object; `unknown` is never zero risk.
    Coverage is limited to the pilot bbox (see /coverage). Routes outside it return 422 OUTSIDE_COVERAGE.
  license:
    name: Proprietary (data attributions in /data-sources)
servers:
  - url: /api/v1
tags:
  - name: system
  - name: map
  - name: routing
  - name: weather
  - name: reports
  - name: models
  - name: admin
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      responses:
        "200":
          description: Service and dependency health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /coverage:
    get:
      tags: [system]
      operationId: getCoverage
      responses:
        "200":
          description: Pilot coverage area and known gaps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
  /data-sources:
    get:
      tags: [system]
      operationId: listDataSources
      responses:
        "200":
          description: Source inventory with licence, attribution and freshness.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataSource" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /weather/current:
    get:
      tags: [weather]
      operationId: getCurrentWeather
      responses:
        "200":
          description: Latest ECCC observation for the pilot area.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherCurrent" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /weather/forecast:
    get:
      tags: [weather]
      operationId: getWeatherForecast
      parameters:
        - name: hours
          in: query
          schema: { type: integer, minimum: 1, maximum: 48, default: 24 }
      responses:
        "200":
          description: |
            ECCC City Page Weather (Montréal, qc-147) hourly forecast and active alerts (alerts unaltered).
            v1.8: `periods` are the ECCC hourly forecasts (1 h each); fewer than `hours` are returned when ECCC publishes fewer
            (typically 24). Named text periods ("Tonight", "Thursday") are in `text_periods` (ECCC gives them no timestamps).
            Served from the API's in-memory cache (single-flight refresh); `freshness` says whether it is current.
            503 UPSTREAM_UNAVAILABLE only when no validated forecast has ever been obtained or the last one has expired.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherForecast" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /weather/alerts:
    get:
      tags: [weather]
      operationId: getWeatherAlerts
      description: |
        ECCC weather alerts intersecting the coverage area, text reproduced verbatim (ECCC licence: no alteration of content or intent).
        An empty `alerts` list means ECCC reported no alerts for the queried area at `provenance.fetched_at`; it never means conditions are safe.
      responses:
        "200":
          description: Active ECCC alerts with freshness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeatherAlerts" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /data-status:
    get:
      tags: [system]
      operationId: getDataStatus
      description: Freshness of every dynamic data product and how it is refreshed. Never triggers a refresh by itself.
      responses:
        "200":
          description: Per-product freshness.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataStatus" }
  /hazards:
    get:
      tags: [map]
      operationId: listHazards
      description: Closures (confirmed), aggregated 311 reports (unverified_report), approved community reports.
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - name: kind
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/HazardKind" }
          style: form
          explode: false
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: GeoJSON FeatureCollection of hazards.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/HazardCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /map/segments:
    get:
      tags: [map]
      operationId: listSegments
      parameters:
        - $ref: "#/components/parameters/Bbox"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Pedestrian edges in bbox with condition evidence.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/SegmentCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /models/status:
    get:
      tags: [models]
      operationId: getModelStatus
      responses:
        "200":
          description: Active risk layer, its evaluation metrics (measured only) and whether it is enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelStatus" }
  /routes/compare:
    post:
      tags: [routing]
      operationId: compareRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteCompareRequest" }
            example:
              origin: { lon: -73.5772, lat: 45.5048 }
              destination: { lon: -73.5698, lat: 45.5017 }
              profile: standard
              locale: en
      responses:
        "200":
          description: Shortest and winter-aware routes with explanations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteCompareResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: No legal pedestrian path under the requested constraints (code NO_ROUTE).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /reports:
    post:
      tags: [reports]
      operationId: createReport
      description: v1.7 — returns 503 WRITES_DISABLED when the deployment disables public writes (API_PUBLIC_WRITES=false). Community report. Stored as `pending`; never shown as guidance until approved. Expires automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportCreate" }
      responses:
        "201":
          description: Accepted for moderation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportReceipt" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /reports/{reportId}:
    delete:
      tags: [reports]
      operationId: deleteOwnReport
      description: "Reporter deletes own report with the deletion token from the receipt. v1.5 (CR-ROUTING-4): a wrong, missing or malformed token, or an unknown/non-UUID id, returns 404 NOT_FOUND so the response never reveals whether a report exists. 400/422/429 remain declared for transport-level errors and rate limiting."
      parameters:
        - $ref: "#/components/parameters/ReportId"
        - name: X-Deletion-Token
          in: header
          required: true
          schema: { type: string, minLength: 32, maxLength: 128 }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /admin/reports:
    get:
      tags: [admin]
      operationId: listReportsForModeration
      security: [{ adminBearer: [] }]
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/ModerationStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Reports awaiting or past moderation.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReportAdminView" }
                  next_cursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /admin/reports/{reportId}/moderation:
    post:
      tags: [admin]
      operationId: moderateReport
      security: [{ adminBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/ReportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject, expire] }
                note: { type: string, maxLength: 500 }
      responses:
        "200":
          description: Updated report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportAdminView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /pilot-requests:
    post:
      tags: [system]
      operationId: createPilotRequest
      description: Business/pilot enquiry form. Minimal personal data; retention 12 months. v1.7 — returns 503 WRITES_DISABLED when API_PUBLIC_WRITES=false.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PilotRequest" }
      responses:
        "201": { description: Received. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
  parameters:
    Bbox:
      name: bbox
      in: query
      required: true
      description: "minLon,minLat,maxLon,maxLat (EPSG:4326). Max area 0.0025 deg² (~5 km²); larger → 422 BBOX_TOO_LARGE."
      schema: { type: string, pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$' }
      example: "-73.5800,45.5000,-73.5700,45.5060"
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    ReportId:
      name: reportId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Malformed request.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unprocessable:
      description: "Valid syntax but rejected: OUTSIDE_COVERAGE (point outside pilot bbox), OFF_NETWORK (v1.3: inside bbox but > 75 m from the routable network; details.which and details.max_snap_distance_m), BBOX_TOO_LARGE, VALIDATION_ERROR."
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Not found.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Missing/invalid admin token.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: Upstream source unavailable; body explains which.
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, OUTSIDE_COVERAGE, OFF_NETWORK, BBOX_TOO_LARGE, NO_ROUTE, NOT_FOUND, UNAUTHORIZED, RATE_LIMITED, UPSTREAM_UNAVAILABLE, WRITES_DISABLED, INTERNAL]
        message: { type: string }
        details: { type: object, additionalProperties: true }
        request_id: { type: string }

    EvidenceState:
      type: string
      enum: [confirmed, unverified_report, model_estimate, unknown, simulated]
      description: "confirmed = official/verified observation; unverified_report = 311 or community report; model_estimate = validated model or labeled heuristic; unknown = no data; simulated = demo only, must be shown with SIMULATED badge."
    Evidence:
      type: object
      required: [state, source_ids, observed_at]
      properties:
        state: { $ref: "#/components/schemas/EvidenceState" }
        source_ids:
          type: array
          items: { type: string }
        observed_at: { type: [string, "null"], format: date-time, description: "Time of underlying observation; null when unknown." }
        retrieved_at: { type: [string, "null"], format: date-time }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1, description: "Only for model_estimate with calibrated output; else null." }
        note: { type: [string, "null"] }

    LonLat:
      type: object
      required: [lon, lat]
      properties:
        lon: { type: number, minimum: -180, maximum: 180 }
        lat: { type: number, minimum: -90, maximum: 90 }
    Position:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }
      description: "[longitude, latitude]"
    LineString:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: LineString }
        coordinates:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/Position" }
    Point:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Point }
        coordinates: { $ref: "#/components/schemas/Position" }
    Polygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Polygon }
        coordinates:
          type: array
          items:
            type: array
            items: { $ref: "#/components/schemas/Position" }

    Health:
      type: object
      required: [status, version, checks]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, degraded, down, disabled] }
              detail: { type: string }

    Coverage:
      type: object
      required: [pilot_name, bbox, area, graph, known_gaps]
      properties:
        pilot_name: { type: string, example: "McGill / Downtown pilot" }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: number }
          example: [-73.588, 45.496, -73.562, 45.513]
        area: { $ref: "#/components/schemas/Polygon" }
        graph:
          type: object
          required: [node_count, edge_count, built_at, osm_snapshot]
          properties:
            node_count: { type: integer }
            edge_count: { type: integer }
            largest_component_share: { type: number, minimum: 0, maximum: 1 }
            built_at: { type: [string, "null"], format: date-time }
            osm_snapshot: { type: [string, "null"] }
        known_gaps:
          type: array
          items:
            type: object
            required: [description]
            properties:
              description: { type: string }
              geometry: { oneOf: [ { $ref: "#/components/schemas/Polygon" }, { $ref: "#/components/schemas/Point" }, { type: "null" } ] }

    DataSource:
      type: object
      required: [id, name, publisher, license, license_url, commercial_use, attribution, url, status]
      properties:
        id: { type: string, example: "mtl-311" }
        name: { type: string }
        publisher: { type: string }
        license: { type: string }
        license_url: { type: string, format: uri }
        commercial_use: { type: string, enum: [allowed, allowed_with_conditions, not_allowed, unverified] }
        attribution: { type: string }
        url: { type: string, format: uri }
        status: { type: string, enum: [active, stale, disabled, requires_credentials, error] }
        last_success_at: { type: [string, "null"], format: date-time }
        record_count: { type: [integer, "null"] }
        notes: { type: [string, "null"] }

    WeatherCurrent:
      type: object
      required: [station_id, observed_at, evidence]
      properties:
        station_id: { type: string }
        station_name: { type: string }
        observed_at: { type: string, format: date-time }
        temperature_c: { type: [number, "null"] }
        precipitation_mm_1h: { type: [number, "null"] }
        snow_depth_cm: { type: [number, "null"] }
        wind_speed_kmh: { type: [number, "null"] }
        freeze_thaw_24h: { type: [boolean, "null"], description: "Temperature crossed 0 °C in the last 24 h (derived from observations)." }
        wind_chill_c: { type: [number, "null"], description: "v1.8. As published by ECCC; null when not published (never computed by WinterPath)." }
        condition: { $ref: "#/components/schemas/LocalizedText" }
        freshness: { $ref: "#/components/schemas/Freshness" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        evidence: { $ref: "#/components/schemas/Evidence" }
    WeatherForecast:
      type: object
      required: [issued_at, periods, alerts, evidence]
      properties:
        issued_at: { type: string, format: date-time }
        periods:
          type: array
          items:
            type: object
            required: [start, end, summary_en, summary_fr]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              summary_en: { type: string }
              summary_fr: { type: string }
              temperature_c: { type: [number, "null"] }
              pop_percent: { type: [integer, "null"], description: "ECCC likelihood of precipitation." }
              wind_speed_kmh: { type: [number, "null"] }
              wind_gust_kmh: { type: [number, "null"] }
        text_periods:
          type: array
          description: v1.8. ECCC named forecast periods, verbatim text, no timestamps.
          items:
            type: object
            required: [name, summary]
            properties:
              name: { $ref: "#/components/schemas/LocalizedText" }
              summary: { $ref: "#/components/schemas/LocalizedText" }
              temperature_high_c: { type: [number, "null"] }
              temperature_low_c: { type: [number, "null"] }
              wind_chill_c: { type: [number, "null"] }
              precipitation: { $ref: "#/components/schemas/LocalizedText" }
        location: { type: [string, "null"], description: "v1.8. ECCC location id, e.g. qc-147 (Montréal)." }
        freshness: { $ref: "#/components/schemas/Freshness" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        alerts:
          type: array
          items:
            type: object
            required: [id, headline, text, language, issued_at]
            description: Reproduced unaltered from ECCC.
            properties:
              id: { type: string }
              headline: { type: string }
              text: { type: string }
              language: { type: string, enum: [en, fr] }
              severity: { type: [string, "null"] }
              issued_at: { type: string, format: date-time }
              expires_at: { type: [string, "null"], format: date-time }
        evidence: { $ref: "#/components/schemas/Evidence" }

    LocalizedText:
      type: object
      required: [en, fr]
      properties:
        en: { type: [string, "null"] }
        fr: { type: [string, "null"] }
    FreshnessState:
      type: string
      enum: [current, delayed, stale, unavailable]
      description: "current = within the product's expected cadence; delayed = late but usable; stale = too old to present as current (UI must label it); unavailable = none, or past its validity."
    Freshness:
      type: object
      required: [state, reason, evaluated_at]
      properties:
        state: { $ref: "#/components/schemas/FreshnessState" }
        reason: { type: string }
        evaluated_at: { type: string, format: date-time }
    Provenance:
      type: object
      required: [provider, product, source_url, fetched_at, validated_at, attribution, licence_url]
      properties:
        provider: { type: string, example: "eccc-geomet" }
        product: { type: string, example: "citypageweather-realtime/qc-147" }
        source_url: { type: string, format: uri }
        issued_at: { type: [string, "null"], format: date-time }
        valid_from: { type: [string, "null"], format: date-time }
        valid_to: { type: [string, "null"], format: date-time }
        fetched_at: { type: string, format: date-time }
        validated_at: { type: string, format: date-time }
        attribution: { type: string }
        licence_url: { type: string, format: uri }
    WeatherAlert:
      type: object
      required: [id, type, name, text, area_name, area_match]
      properties:
        id: { type: string }
        type: { type: [string, "null"], description: "warning | watch | advisory | statement, as published." }
        name: { $ref: "#/components/schemas/LocalizedText" }
        text: { $ref: "#/components/schemas/LocalizedText" }
        area_name: { $ref: "#/components/schemas/LocalizedText" }
        risk_colour: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date-time }
        valid_from: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        area_match: { type: string, enum: [bbox_intersects, polygon_intersects], description: "bbox_intersects may include neighbouring areas (e.g. Laval)." }
    WeatherAlerts:
      type: object
      required: [alerts, freshness]
      properties:
        alerts: { type: array, items: { $ref: "#/components/schemas/WeatherAlert" } }
        freshness: { $ref: "#/components/schemas/Freshness" }
        provenance: { oneOf: [ { $ref: "#/components/schemas/Provenance" }, { type: "null" } ] }
    DataStatus:
      type: object
      required: [generated_at, products]
      properties:
        generated_at: { type: string, format: date-time }
        products:
          type: array
          items:
            type: object
            required: [id, freshness, mechanism]
            properties:
              id: { type: string, enum: [weather_observations, weather_forecast, weather_alerts, closures, reports_311, risk_scores, pedestrian_graph] }
              freshness: { $ref: "#/components/schemas/Freshness" }
              last_success_at: { type: [string, "null"], format: date-time }
              expected_cadence: { type: [string, "null"], description: "ISO 8601 duration, e.g. PT1H." }
              mechanism: { type: string, enum: [api_on_demand, scheduled_job, manual] }
              notes: { type: [string, "null"] }

    HazardKind:
      type: string
      enum: [sidewalk_closure, construction_impact, report_311_aggregate, community_report]
    HazardFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { const: Feature }
        id: { type: string }
        geometry: { oneOf: [ { $ref: "#/components/schemas/Point" }, { $ref: "#/components/schemas/LineString" }, { $ref: "#/components/schemas/Polygon" } ] }
        properties:
          type: object
          required: [kind, evidence, blocks_passage]
          properties:
            kind: { $ref: "#/components/schemas/HazardKind" }
            evidence: { $ref: "#/components/schemas/Evidence" }
            blocks_passage: { type: [boolean, "null"], description: "true only when source explicitly states pedestrian passage is blocked; null = not stated." }
            title_en: { type: string }
            title_fr: { type: string }
            valid_from: { type: [string, "null"], format: date-time }
            valid_to: { type: [string, "null"], format: date-time }
            report_count: { type: [integer, "null"], description: "For 311 aggregates (H3 cell)." }
    HazardCollection:
      type: object
      required: [type, features, next_cursor]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items: { $ref: "#/components/schemas/HazardFeature" }
        next_cursor: { type: [string, "null"] }

    SegmentFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { const: Feature }
        id: { type: string, description: "Stable edge_id (see data-model.md)." }
        geometry: { $ref: "#/components/schemas/LineString" }
        properties:
          type: object
          required: [length_m, edge_kind, connectivity_confidence, accessibility, risk, sources]
          properties:
            length_m: { type: number, minimum: 0 }
            edge_kind: { type: string, enum: [sidewalk, footway, path, pedestrian_street, crossing, shared_street, steps, other] }
            crossing: { $ref: "#/components/schemas/CrossingInfo" }
            connectivity_confidence: { type: string, enum: [high, medium, low] }
            accessibility: { $ref: "#/components/schemas/Accessibility" }
            risk: { $ref: "#/components/schemas/RiskEstimate" }
            sources: { type: array, items: { type: string } }
            updated_at: { type: [string, "null"], format: date-time }
    SegmentCollection:
      type: object
      required: [type, features, next_cursor]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items: { $ref: "#/components/schemas/SegmentFeature" }
        next_cursor: { type: [string, "null"] }
    CrossingInfo:
      type: [object, "null"]
      properties:
        type: { type: string, enum: [marked, traffic_signals, unmarked, uncontrolled, unknown] }
        kerb: { type: string, enum: [lowered, flush, raised, unknown] }
    Accessibility:
      type: object
      required: [step_free]
      properties:
        step_free: { type: [boolean, "null"], description: "null = unknown; only true when verified by source tag." }
        incline_percent: { type: [number, "null"] }
        width_m: { type: [number, "null"] }
        surface: { type: [string, "null"] }
    RiskEstimate:
      type: object
      required: [level, evidence]
      properties:
        level: { type: string, enum: [low, moderate, elevated, high, unknown] }
        probability: { type: [number, "null"], minimum: 0, maximum: 1, description: "Calibrated P(winter 311 report in cell, next 24h). Null unless model enabled." }
        evidence: { $ref: "#/components/schemas/Evidence" }

    RouteProfile:
      type: string
      enum: [standard, step_free, reduced_mobility]
      description: "step_free is a HARD constraint: edges with step_free != true are excluded."
    RouteCompareRequest:
      type: object
      required: [origin, destination]
      additionalProperties: false
      properties:
        origin: { $ref: "#/components/schemas/LonLat" }
        destination: { $ref: "#/components/schemas/LonLat" }
        profile: { $ref: "#/components/schemas/RouteProfile" }
        departure_time: { type: string, format: date-time }
        avoid_unverified_reports: { type: boolean, default: true }
        locale: { type: string, enum: [en, fr], default: en }
    RouteVariant:
      type: string
      enum: [shortest, winter_aware]
    Route:
      type: object
      required: [variant, geometry, distance_m, duration_s, edge_ids, explanation, data_freshness, unknown_share]
      properties:
        variant: { $ref: "#/components/schemas/RouteVariant" }
        geometry: { $ref: "#/components/schemas/LineString" }
        distance_m: { type: number, minimum: 0 }
        duration_s: { type: number, minimum: 0 }
        generalized_cost_s: { type: number, minimum: 0 }
        edge_ids: { type: array, items: { type: string } }
        unknown_share: { type: number, minimum: 0, maximum: 1, description: "Fraction of route length with risk.level = unknown." }
        hazards_avoided: { type: array, items: { type: string } }
        hazards_on_route: { type: array, items: { type: string } }
        explanation:
          type: array
          description: "v1.5 (CR-ROUTING-9) evidence mapping: SHORTEST_DISTANCE, WINTER_AWARE_COST, IDENTICAL_TO_SHORTEST, RISK_LAYER_UNAVAILABLE → unknown; STEP_FREE_TAGGED_ONLY, INCLUDES_STEPS → unverified_report (community-mapped OSM tags); closures/confirmed disruptions active at the requested time → confirmed; PASSES_POSSIBLE_CLOSURE, AVOIDS_POSSIBLE_CLOSURE (permit confirmed, activity unknown) → unknown; REDUCED_MOBILITY_SPEED (assumed speed, labelled heuristic) → model_estimate; RISK_UNKNOWN_SHARE → unknown; 311/community reports → unverified_report; LOWER_MODELED_RISK → model_estimate; SIMULATED_DATA → simulated."
          items:
            type: object
            required: [code, text, evidence_state]
            properties:
              code: { type: string, example: "AVOIDS_CONFIRMED_CLOSURE" }
              text: { type: string, description: "Localized per request locale." }
              evidence_state: { $ref: "#/components/schemas/EvidenceState" }
        steps:
          type: array
          description: List-based accessible directions.
          items:
            type: object
            required: [instruction, distance_m]
            properties:
              instruction: { type: string }
              distance_m: { type: number }
              street_name: { type: [string, "null"] }
        data_freshness:
          type: object
          additionalProperties: { type: [string, "null"], format: date-time }
          description: source_id → last successful refresh.
    RouteCompareResponse:
      type: object
      required: [request_id, routes, computed_at, risk_layer]
      properties:
        request_id: { type: string }
        routes:
          type: array
          minItems: 1
          maxItems: 2
          items: { $ref: "#/components/schemas/Route" }
        identical: { type: boolean, description: "true when winter_aware equals shortest." }
        risk_layer: { type: string, enum: [model, heuristic, none] }
        computed_at: { type: string, format: date-time }
        weather_context:
          description: "v1.8. Forecast hour covering departure_time, for display. `used_for: display_only` — the risk score does not use forecasts until a forecast-aware model is validated."
          oneOf:
            - type: "null"
            - type: object
              required: [departure_time, used_for, freshness]
              properties:
                departure_time: { type: string, format: date-time }
                used_for: { type: string, enum: [display_only] }
                hour_start: { type: [string, "null"], format: date-time }
                condition: { $ref: "#/components/schemas/LocalizedText" }
                temperature_c: { type: [number, "null"] }
                pop_percent: { type: [integer, "null"] }
                freshness: { $ref: "#/components/schemas/Freshness" }
        warnings: { type: array, items: { type: string } }

    ReportCategory:
      type: string
      enum: [snow, ice, obstructed_ramp, construction, other]
    ModerationStatus:
      type: string
      enum: [pending, approved, rejected, expired, deleted]
    ReportCreate:
      type: object
      required: [category, location, location_consent]
      additionalProperties: false
      properties:
        category: { $ref: "#/components/schemas/ReportCategory" }
        location: { $ref: "#/components/schemas/LonLat" }
        location_consent: { type: boolean, const: true, description: "Explicit consent to submit this exact location." }
        description: { type: string, maxLength: 280 }
        locale: { type: string, enum: [en, fr] }
    ReportReceipt:
      type: object
      required: [id, status, expires_at, deletion_token]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ModerationStatus" }
        expires_at: { type: string, format: date-time }
        deletion_token: { type: string, description: "Shown once; only a hash is stored." }
    ReportAdminView:
      type: object
      required: [id, category, location, status, created_at, expires_at]
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/ReportCategory" }
        location: { $ref: "#/components/schemas/LonLat" }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/ModerationStatus" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        moderated_at: { type: [string, "null"], format: date-time }
        moderation_note: { type: [string, "null"] }

    ModelStatus:
      type: object
      required: [risk_layer, enabled, target, evaluation]
      properties:
        risk_layer: { type: string, enum: [model, heuristic, none] }
        enabled: { type: boolean }
        model_id: { type: [string, "null"] }
        target: { type: string, example: "P(>=1 winter-related 311 report in H3 res-9 cell within next 24h)" }
        trained_at: { type: [string, "null"], format: date-time }
        training_window: { type: [string, "null"] }
        evaluation:
          type: [object, "null"]
          description: Measured metrics only; null if not evaluated.
          properties:
            split: { type: string, example: "chronological 2024-11..2025-03 holdout + spatial block holdout" }
            pr_auc: { type: number }
            brier: { type: number }
            precision_at_k: { type: number }
            recall_at_k: { type: number }
            baseline_pr_auc: { type: number }
            n_test: { type: integer }
        limitations: { type: array, items: { type: string } }

    PilotRequest:
      type: object
      required: [organization, contact_email, segment, consent]
      additionalProperties: false
      properties:
        organization: { type: string, maxLength: 120 }
        contact_name: { type: string, maxLength: 120 }
        contact_email: { type: string, format: email }
        segment: { type: string, enum: [university, campus, municipality, property_manager, other] }
        message: { type: string, maxLength: 1000 }
        consent: { type: boolean, const: true }
        locale: { type: string, enum: [en, fr] }
