# WinterPath scheduled jobs (contract v1.7: GitHub Actions cron instead of Render cron).
# DRAFT — inert until the repository secret WP_ETL_DATABASE_URL is added: every job checks for
# it first and exits successfully with a ::notice when it is missing, so nothing touches any
# database before the user opts in.
#
# WP_ETL_DATABASE_URL: Supabase SESSION pooler URL for a login user in role wp_writer (never
# the owner/service role). It is passed only to the steps that connect, never to third-party
# actions, and GitHub masks it in logs.
#
# PRIMARY TRIGGER (2026-11-13): Cloudflare Worker winterpath-scheduler (infra/cron-worker/) calls
# workflow_dispatch at the same UTC times, because these `schedule:` events mostly never fired for
# this repo. Keep both in sync; the crons below remain a best-effort backup.
#
# Schedules are UTC (GitHub cron has no time zones). Scheduled runs only fire on the default
# branch, are best effort (delayed or dropped under GitHub load or incidents — e.g. the 21:17 UTC
# weather slot on 2026-11-11 fell inside an Actions outage), and in a PUBLIC repository are
# auto-disabled after 60 days without repository activity. Freshness is therefore monitored from
# the data itself (infra/MONITORING.md), never by keep-alive pings.
#
# Overlap rules: each job has its own concurrency group with cancel-in-progress: false, so a job
# never runs twice at once and never kills a load mid-transaction (at most one run in progress plus
# one pending; a newer pending run replaces an older pending one). Exclusion ACROSS jobs and
# workflows that write the same tables is the database's job: ETL advisory locks
# (infra/ETL-LOCKS.md; implemented by Data in wp-ingest load). On contention a load prints
# "::notice::lock (1464878420,<objid>) held by another run — skipping", writes nothing and exits 0,
# so the job succeeds. Example: the daily and weekly 311 jobs have separate groups but share
# lock (WPET,4); whichever comes second skips.
name: scheduled

on:
  schedule:
    - cron: "17 */3 * * *"   # weather ingest every 3 h (minute 17 avoids top-of-hour congestion)
    # Daily scoring twice: 12:07 and 18:07 UTC (07:07/13:07 EST, 08:07/14:07 EDT). ML saw the 311
    # file with no rows for the current day at 12:44 local, so the second run catches late inputs.
    # ML's scorer is idempotent: exit 0 if the day is already scored or inputs are incomplete.
    # Minute 7, not 0: GitHub documents high load at the start of every hour, when scheduled runs
    # may be delayed or dropped (v2 Wave 1 cron diagnosis, docs/agent-reports/platform.md).
    - cron: "7 12 * * *"
    - cron: "7 18 * * *"
    # 311 (Data c6c0b79). Daily incremental refresh of the last 14 days through the portal's
    # DataStore (~5 KB per run, ~1 MB at peak winter), at 11:27 so it lands before the 12:07 scoring.
    - cron: "27 11 * * *"
    # Weekly FULL 311 rebuild (~850 MB download), Sunday 10:47 UTC, before that day's 11:27
    # incremental run. Needed because upstream edits to days older than the 14-day window are only
    # picked up by a full rebuild (services/ingestion/README.md, "Daily 311 refresh").
    - cron: "47 10 * * 0"
    # Closures (Ville de Montréal "Entraves et travaux en cours", pilot bbox, ~1.7 MB per run).
    # The portal publishes daily (CKAN update_frequency "daily"; files dated ~07:00 on
    # 2026-11-12, time zone not stated), so two runs bracket both readings of that time:
    # 09:37 UTC and 15:37 UTC. The API reads wp.closure on every request (no restart needed).
    - cron: "37 9 * * *"
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: which job to run ('both' = weather + scoring, as before)
        type: choice
        options: [weather, scoring, both, "311", 311-full, closures]
        default: both

permissions: {}

env:
  UV_VERSION: "0.10.7"
  PYTHON_VERSION: "3.12"

jobs:
  weather-ingest:
    name: weather ingest (ECCC -> wp.weather_obs/daily)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 */3 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'weather' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: scheduled-weather-ingest
      cancel-in-progress: false   # never kill a load mid-transaction; queue the next run
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - name: gate on WP_ETL_DATABASE_URL
        id: gate
        working-directory: .
        env:
          WP_ETL_DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          if [ -z "$WP_ETL_DATABASE_URL" ]; then
            echo "::notice title=SKIP weather ingest::repository secret WP_ETL_DATABASE_URL is not set — nothing ran"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.configured == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install (locked)
        if: steps.gate.outputs.configured == 'true'
        run: uv sync --locked --no-dev
      - name: fetch ECCC observations (no database access)
        if: steps.gate.outputs.configured == 'true'
        run: uv run --locked wp-ingest eccc --refresh
      - name: load weather into PostGIS (eccc-geomet only, last 365 days)
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        # --weather-since bounds hosted wp.weather_obs (Data's estimate: ~41–51 MB total).
        run: uv run --locked wp-ingest load --source eccc-geomet --weather-since "$(date -u -d '365 days ago' +%F)"

  daily-scoring:
    name: daily risk scoring (-> wp.risk_cell_score)
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '7 12 * * *' || github.event.schedule == '7 18 * * *')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'scoring' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: scheduled-daily-scoring
      cancel-in-progress: false
    env:
      # ML's v1.7 scorer (services/ml/src/winterpath_ml/score.py; flags --fetch-311 --write-db).
      # The job still refuses to run on a commit where services/ml does not reference wp.risk_cell_score.
      SCORING_MODULE: winterpath_ml.score
      # The two scoring artifacts are committed (integration 5238c45 .gitignore; sha256-verified
      # against models/registry.json by ML before use) — read from the checkout, no download.
      MODEL_ARTIFACT_DIR: ${{ github.workspace }}/models/artifacts
    defaults:
      run:
        working-directory: services/ml
    steps:
      - name: gate on WP_ETL_DATABASE_URL
        id: gate
        working-directory: .
        env:
          WP_ETL_DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          if [ -z "$WP_ETL_DATABASE_URL" ]; then
            echo "::notice title=SKIP daily scoring::repository secret WP_ETL_DATABASE_URL is not set — nothing ran"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - name: gate on ML DB scorer (contract v1.7)
        id: scorer
        if: steps.gate.outputs.configured == 'true'
        run: |
          if grep -rqs "risk_cell_score" src/; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=SKIP daily scoring::services/ml does not write wp.risk_cell_score on this commit — nothing ran"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scorer.outputs.present == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install (locked, db extra)
        if: steps.scorer.outputs.present == 'true'
        run: uv sync --locked --no-dev --extra db
      - name: score today (America/Montreal local day)
        if: steps.scorer.outputs.present == 'true'
        env:
          DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          day="$(TZ=America/Montreal date +%F)"
          echo "scoring day=$day module=$SCORING_MODULE"
          # --fetch-311: the runner has no cached aggregate (fresh ~850 MB download every run, on
          #   purpose: the 18:00 run exists to pick up 311 rows missing at 12:00).
          # --write-db: write wp.risk_cell_score (without it, parquet lands on the ephemeral runner).
          uv run --locked python -m "$SCORING_MODULE" --start "$day" --fetch-311 --write-db

  report-311-daily:
    name: 311 daily refresh (14-day window -> wp.report_311_cell)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '27 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == '311')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: scheduled-311-daily
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - name: gate on WP_ETL_DATABASE_URL
        id: gate
        working-directory: .
        env:
          WP_ETL_DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          if [ -z "$WP_ETL_DATABASE_URL" ]; then
            echo "::notice title=SKIP 311 daily refresh::repository secret WP_ETL_DATABASE_URL is not set — nothing ran"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.configured == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install (locked)
        if: steps.gate.outputs.configured == 'true'
        run: uv sync --locked --no-dev
      - name: fetch the last 14 days and load the window (lock WPET,4; contention -> skip, exit 0)
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        # The fetch prints fetch.source_data_through / latest_winter_row, so the run log shows
        # whether "no new rows" is source reality or a stale pipeline.
        run: uv run --locked wp-ingest 311 --recent-days 14 && uv run --locked wp-ingest load --source mtl-311 --recent

  report-311-weekly-full:
    name: 311 weekly full rebuild (-> wp.report_311_cell)
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '47 10 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == '311-full')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: scheduled-311-weekly-full
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - name: gate on WP_ETL_DATABASE_URL
        id: gate
        working-directory: .
        env:
          WP_ETL_DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          if [ -z "$WP_ETL_DATABASE_URL" ]; then
            echo "::notice title=SKIP 311 weekly full rebuild::repository secret WP_ETL_DATABASE_URL is not set — nothing ran"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.configured == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install (locked)
        if: steps.gate.outputs.configured == 'true'
        run: uv sync --locked --no-dev
      - name: download the full 311 file (~850 MB) and rebuild the aggregate (no database access)
        if: steps.gate.outputs.configured == 'true'
        run: uv run --locked wp-ingest 311 --refresh
      - name: load the full 311 aggregate (lock WPET,4; contention -> skip, exit 0)
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: uv run --locked wp-ingest load --source mtl-311

  closures-refresh:
    name: closures refresh (Entraves -> wp.closure, pilot bbox)
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '37 9 * * *' || github.event.schedule == '37 15 * * *')) ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'closures')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: scheduled-closures-refresh
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - name: gate on WP_ETL_DATABASE_URL
        id: gate
        working-directory: .
        env:
          WP_ETL_DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: |
          if [ -z "$WP_ETL_DATABASE_URL" ]; then
            echo "::notice title=SKIP closures refresh::repository secret WP_ETL_DATABASE_URL is not set — nothing ran"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.configured == 'true'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install (locked)
        if: steps.gate.outputs.configured == 'true'
        run: uv sync --locked --no-dev
      - name: download Entraves + impacts and build pilot closures (no database access)
        if: steps.gate.outputs.configured == 'true'
        run: uv run --locked wp-ingest entraves --refresh
      - name: load closures (lock WPET,3; staged merge, prunes permits no longer published; contention -> skip, exit 0)
        if: steps.gate.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.WP_ETL_DATABASE_URL }}
        run: uv run --locked wp-ingest load --source mtl-entraves
