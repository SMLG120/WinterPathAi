[project]
name = "winterpath-routing"
version = "0.1.0"
description = "WinterPath AI pedestrian routing core (pure Python library: graph in, route out)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "networkx>=3.3",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
postgis = ["sqlalchemy>=2.0", "psycopg[binary]>=3.2"]
# compiled Dijkstra for CompactRoutingEngine(fast_search=True)
fast = ["scipy>=1.13"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winterpath_routing"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["latency: latency measurement (prints p50/p95)"]
