[project]
name = "winterpath-ingestion"
version = "0.1.0"
description = "WinterPath AI ingestion: OSM pedestrian graph, Montreal open data, ECCC weather"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "geoalchemy2>=0.21.0",
    "geopandas>=1.2.0",
    "h3>=4.5.0",
    "networkx>=3.7",
    "osmnx>=2.1.1",
    "psycopg[binary]>=3.3.8",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
wp-ingest = "winterpath_ingestion.cli:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access", "postgis: requires a running PostGIS"]
addopts = "-m 'not network'"
