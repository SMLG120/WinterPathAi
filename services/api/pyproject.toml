[project]
name = "winterpath-api"
version = "0.1.0"
description = "WinterPath AI HTTP API (FastAPI) — implements docs/contracts/openapi.yaml v1."
requires-python = ">=3.12,<3.13"
dependencies = [
  "winterpath-routing[postgis]",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "email-validator>=2.2",
  "structlog>=24.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "h3>=4.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "pyyaml>=6.0",
  "ruff>=0.6",
]

[tool.uv.sources]
winterpath-routing = { path = "../routing", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winterpath_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
