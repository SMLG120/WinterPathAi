[project]
name = "winterpath-ml"
version = "0.1.0"
description = "WinterPath AI — winter 311 report-risk research pipeline and inference interface"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "h3>=4.1",
    "joblib>=1.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0"]
# Phase 5 candidate: XGBoost 3.4.1 exact pin, Apache-2.0 (verified from the wheel LICENSE, 2026-11-12).
# Linux uses the CPU-only build: `xgboost` on Linux pulls nvidia-nccl-cu13 (206 MB, no licence metadata).
phase5 = [
    "xgboost-cpu==3.4.1; sys_platform == 'linux'",
    "xgboost==3.4.1; sys_platform != 'linux'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
