[project]
name = "winterpath-ml"
version = "0.1.0"
description = "WinterPath AI — winter 311 report-risk research pipeline and inference interface"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "h3>=4.1",
    "joblib>=1.4",
    "scipy>=1.13",
]

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
