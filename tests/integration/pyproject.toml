[project]
name = "winterpath-integration-tests"
version = "0.1.0"
description = "WinterPath contract, smoke, privacy and CORS tests + schema-only stub server (Platform agent)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pytest>=8.3",
  "httpx>=0.27",
  "schemathesis>=4.0",
  "pyyaml>=6.0",
  "jsonschema[format]>=4.23",
  "openapi-spec-validator>=0.7",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
markers = [
  "contract: Schemathesis contract tests against API_BASE_URL",
  "smoke: smoke tests (/health, /coverage, v1.8 /data-status /weather/alerts)",
  "privacy: log privacy tests",
  "cors: CORS policy tests",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101"]
