# Alembic config for the WinterPath `wp` schema. Owner: Data agent.
# URL comes from env DATABASE_URL (see db/migrations/env.py); never put credentials here.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_table_schema = public

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
