# WinterPath AI — local development stack (no paid services, no Redis).
#
# One shared PostGIS container serves every agent worktree (project name is pinned
# so `make up` from any worktree targets the same container on host port 55432).
#
# Credentials come from the environment. Locally use the untracked `.env.local`
# generated by scripts/create-worktrees.sh:
#     docker compose --env-file .env.local up -d db        (or: make up)
# Never commit real values; .env.example lists names only.
#
# `api` and `web` are behind profiles because their source trees are owned by other
# agents and may not exist on a given branch. `make up` enables a profile only when
# the corresponding source tree exists and prints an explicit SKIP message otherwise.
name: winterpath

services:
  db:
    image: postgis/postgis:16-3.4
    # Upstream publishes this tag for amd64 only; on Apple Silicon it runs under emulation.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set (use --env-file .env.local)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set (use --env-file .env.local)}
      # Maintenance DB only; per-agent DBs are created by infra/db/init/20-winterpath.sh.
      POSTGRES_DB: postgres
      WP_DATABASES: wp_data wp_routing wp_ml wp_platform wp_integration
    ports:
      # Bound to loopback only — never exposed on the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init/20-winterpath.sh:/docker-entrypoint-initdb.d/20-winterpath.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres && psql -U \"$$POSTGRES_USER\" -d wp_integration -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-wp_integration}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-info}
      API_ADMIN_TOKEN_HASH: ${API_ADMIN_TOKEN_HASH:-}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      MODEL_ARTIFACT_DIR: /app/models/artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8105}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Public build-time values only (Vite inlines VITE_* into the bundle — no secrets).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8105/api/v1}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/positron}
    ports:
      - "127.0.0.1:${WEB_PORT:-5175}:8080"

volumes:
  pgdata:
    name: winterpath_pgdata
